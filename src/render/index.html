<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/todo.css">
    <link rel="stylesheet" href="css/contacts.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body class="body">
    <div class="version">version 1.1</div>
    <!-- Главная сетка приложения -->
    <div class="app-grid">

        <!-- СЛЕВА: Боковая панель управления (как на вашем скриншоте) -->
        <aside class="sidebar">

            <!-- Сюда вставляйте пункты меню (Dashboard, Audience, Posts...) -->
            <nav class="sidebar__nav">
                <!-- Версия перенесена внутрь сайдбара вниз или к логотипу -->
                <a class="link-logo" href="index.html">
                    <img class="logo" src="../App/images/weld-team-logo.png" alt="logo">
                </a>
                <div class="header-nav list-reset">
                    <button id="button-nav-problems" class="header-nav-button button-reset">
                        <img class="header-nav-button-icon" src="../App/images/icons/ktm.png" alt="">
                        <span>KTM</span>
                    </button>
                    <button id="button-nav-contacts" class="header-nav-button button-reset">
                        <img class="header-nav-button-icon" src="../App/images/icons/contacts.png" alt="">
                        <span>Контакты</span>
                    </button>
                     <button id="button-nav-contacts" class="header-nav-button button-reset">
                        <img class="header-nav-button-icon" src="../App/images/icons/tearDown.png" alt="">
                        <span>Tear down</span>
                    </button>
                </div>

            </nav>
        </aside>

        <!-- СПРАВА: Оболочка для верхней шапки и основного контента -->
        <div class="app-content-wrapper">

            <!-- СВЕРХУ: Шапка (с кнопками, профилем и т.д.) -->
            <header class="header">

            </header>

            <!-- СНИЗУ: Основная рабочая область для Dashboard и карточек -->
            <main class="main">
                <div class="main-container">
                </div>
            </main>

        </div> <!-- /app-content-wrapper -->

    </div> <!-- /app-grid -->

    <script type="module" src="render.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topbar@1.0.1/topbar.min.js"></script>

    <div id="customLoader"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 99999; justify-content: center; align-items: center; flex-direction: column;">
        <div
            style="width: 50px; height: 50px; border: 4px solid #fff; border-top-color: #00bcd4; border-radius: 50%; animation: spin 0.8s linear infinite;">
        </div>
        <div style="color: #fff; margin-top: 16px; font-family: monospace;">Загрузка...</div>
    </div>

    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</body>

</html>
